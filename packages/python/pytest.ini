# pytest configuration for the Python package.
#
# History: this file used the setup.cfg-style header `[tool:pytest]`, which
# pytest ignores inside pytest.ini, so none of it was ever applied. It is now a
# valid `[pytest]` section. Coverage flags were dropped on purpose: pytest-cov
# is not a guaranteed dependency and coverage must not gate the run.
# `filterwarnings = error` was dropped: the legacy detector warns on non-string
# input by design, and those warnings must stay visible rather than fatal.
[pytest]
minversion = 6.0
addopts =
    -ra
    --strict-markers
    --strict-config
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with -m "not slow")
    integration: marks tests as integration tests
    performance: marks tests as performance tests
    critical: marks tests as critical safety tests
filterwarnings =
    default
